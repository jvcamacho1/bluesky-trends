name: Deploy VPS

# Substitui o antigo pages.yml: o dashboard agora vive na VPS, atras do nginx.
# Secrets necessarios no repositorio:
#   VPS_HOST         host ou IP da VPS
#   VPS_USER         usuario de deploy (bluesky)
#   VPS_SSH_KEY      conteudo da chave privada ~/.ssh/bluesky
#   VPS_KNOWN_HOSTS  saida de `ssh-keyscan -H <host>` (opcional, mas recomendado)
#   VPS_PATH         caminho remoto (padrao /srv/bluesky)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Sincronizar e subir na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vps
    steps:
      - uses: actions/checkout@v4

      - name: Preparar chave ssh
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/bluesky
          chmod 600 ~/.ssh/bluesky
          if [ -n "${VPS_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          SSH_KEY: ~/.ssh/bluesky
        run: |
          chmod +x deploy/deploy.sh
          SSH_PORT="${VPS_PORT:-22}" \
            deploy/deploy.sh "${VPS_USER}@${VPS_HOST}" "${VPS_PATH:-/srv/bluesky}"
