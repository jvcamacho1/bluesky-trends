name: Promote to main

# Mantem a main sempre com o codigo mais atual.
#
# Inspirado no fluxo do orbita (feature -> develop -> release -> main), adaptado
# a este repositorio, que trabalha com branches `vibe/**` e sem develop:
#
#   1. push numa branch `vibe/**` abre (ou reaproveita) o PR para `main`;
#   2. quando o CI daquele commit fica verde, o PR recebe o label `auto-merge`;
#   3. o merge so acontece se o CI passou no MESMO commit que esta no topo da
#      branch e se nao ha PR aberto mais novo esperando a vez;
#   4. depois do merge, a branch promovida e apagada e as outras `vibe/**`
#      avancam para a main, sem force.
#
# Um unico job de proposito: a cota de minutos de Actions e compartilhada com
# outros projetos da conta, e cada job extra e um runner a mais na fila.

on:
  push:
    branches:
      - "vibe/**"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: promote-to-main
  cancel-in-progress: false

jobs:
  promover:
    name: Levar o que esta verde para a main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Abrir PR, liberar merge e sincronizar
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            async function prAberto(branch) {
              const lista = await github.rest.pulls.list({
                owner, repo, head: `${owner}:${branch}`, base: 'main', state: 'open'
              });
              return lista.data[0] || null;
            }

            async function ciVerde(sha) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 20
              });
              return runs.data.workflow_runs.some(run => run.conclusion === 'success');
            }

            if (context.eventName === 'push' && context.ref.startsWith('refs/heads/vibe/')) {
              const branch = context.ref.replace('refs/heads/', '');
              const existente = await prAberto(branch);
              if (existente) {
                core.info(`PR #${existente.number} ja existe para ${branch}.`);
              } else {
                const pr = await github.rest.pulls.create({
                  owner, repo, head: branch, base: 'main',
                  title: `Promover ${branch.replace(/^vibe\//, '').replace(/-/g, ' ')}`,
                  body: [
                    'PR criado automaticamente para manter a `main` com o codigo mais atual.',
                    '',
                    'O merge acontece sozinho quando o CI deste commit ficar verde.',
                    'Se o CI falhar, o PR fica aberto e vermelho: nada entra na main.'
                  ].join('\n')
                });
                core.info(`PR #${pr.data.number} aberto.`);
              }
            }

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.conclusion !== 'success' || run.event !== 'push') {
                core.info(`CI ${run.conclusion} (${run.event}); nada a promover.`);
                return;
              }
              const branch = run.head_branch;
              if (!branch || !branch.startsWith('vibe/')) {
                core.info(`CI verde em ${branch}: nada a promover.`);
                return;
              }
              const pr = await prAberto(branch);
              if (!pr) {
                core.info(`Nenhum PR aberto para ${branch}.`);
                return;
              }
              const ref = await github.rest.repos.getBranch({ owner, repo, branch });
              if (ref.data.commit.sha !== run.head_sha) {
                core.warning(
                  `${branch} andou depois do CI (${run.head_sha.slice(0, 7)} -> ` +
                  `${ref.data.commit.sha.slice(0, 7)}); esperando o CI do commit novo.`
                );
                return;
              }
              const outros = (await github.paginate(github.rest.pulls.list, {
                owner, repo, base: 'main', state: 'open', per_page: 100
              })).filter(outro => outro.number !== pr.number && outro.created_at > pr.created_at);
              if (outros.length > 0) {
                core.info(`PR #${outros[0].number} e mais novo; #${pr.number} espera a vez.`);
                return;
              }
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number, labels: ['auto-merge']
              });
              core.info(`PR #${pr.number} verde em ${run.head_sha.slice(0, 7)}; liberado.`);
            }

            const abertos = await github.paginate(github.rest.pulls.list, {
              owner, repo, base: 'main', state: 'open', per_page: 100
            });
            let merged = null;
            for (const pr of abertos) {
              if (!pr.labels.some(label => label.name === 'auto-merge')) continue;
              if (!(await ciVerde(pr.head.sha))) {
                core.warning(`CI de ${pr.head.sha.slice(0, 7)} nao esta verde; sem merge.`);
                continue;
              }
              const ref = await github.rest.repos.getBranch({ owner, repo, branch: pr.head.ref });
              if (ref.data.commit.sha !== pr.head.sha) {
                core.warning(`#${pr.number} andou desde o evento; o proximo push resolve.`);
                continue;
              }
              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`
                });
                core.info(`PR #${pr.number} entrou na main.`);
                merged = pr;
              } catch (error) {
                core.warning(`Merge de #${pr.number} nao foi possivel: ${error.message}`);
              }
              break;
            }

            if (!merged) {
              core.info('Nada foi promovido nesta execucao; sem sincronizacao.');
              return;
            }
            const head = merged.head.ref;
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `heads/${head}` });
              core.info(`Branch ${head} apagada.`);
            } catch (error) {
              core.warning(`Nao apaguei ${head}: ${error.message}`);
            }

            const main = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = main.data.commit.sha;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            for (const branch of branches) {
              if (!branch.name.startsWith('vibe/') || branch.name === head) continue;
              const comparacao = await github.rest.repos.compareCommits({
                owner, repo, base: branch.name, head: mainSha
              });
              if (comparacao.data.status !== 'ahead') {
                core.info(`${branch.name} nao avanca limpo (${comparacao.data.status}); fica como esta.`);
                continue;
              }
              await github.rest.git.updateRef({
                owner, repo, ref: `heads/${branch.name}`, sha: mainSha, force: false
              });
              core.info(`${branch.name} atualizada para ${mainSha.slice(0, 7)}.`);
            }
