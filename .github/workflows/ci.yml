name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    name: Lint e testes unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: producer/pyproject.toml

      - name: Instalar dependencias
        working-directory: producer
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: producer
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Pytest (unitarios)
        working-directory: producer
        run: pytest -m "not integration and not contract" -v

      - name: "Pytest (contrato: public.json, privacidade e nginx)"
        working-directory: producer
        run: pytest -m contract -v

      - name: "Compose (portas em 127.0.0.1 e orcamento de recursos)"
        run: docker compose config >/dev/null

  integration:
    name: Teste de integracao (Kafka + Schema Registry)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: producer/pyproject.toml

      - name: Instalar dependencias
        working-directory: producer
        run: pip install -e ".[dev]"

      - name: Pytest (integracao)
        working-directory: producer
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: pytest -m integration -v

      - name: "De ponta a ponta: fixture -> public.json"
        working-directory: producer
        run: pytest -m contract -v

      - name: Logs em caso de falha
        if: failure()
        run: |
          docker compose logs --tail=200 kafka schema-registry || true
