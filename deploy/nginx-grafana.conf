# Grafana do bluesky-trends em subdominio proprio, atras do nginx do host.
#
# Instalacao (como root, na VPS):
#   install -m 644 deploy/nginx-grafana.conf /etc/nginx/sites-available/bluesky-grafana
#   ln -sf /etc/nginx/sites-available/bluesky-grafana /etc/nginx/sites-enabled/bluesky-grafana
#   htpasswd -c /etc/nginx/.htpasswd-trends <usuario>   # o mesmo do dashboard
#   nginx -t && systemctl reload nginx
#
# O certificado vem da Cloudflare Origin CA (Full strict), em /etc/ssl/cloudflare/.
#
# O Grafana escuta so em 127.0.0.1:3000 (ver docker-compose.yml). O proxy fica
# aqui para o container nunca ser publicado direto. Subdominio, nunca subcaminho:
# Grafana nao funciona bem atras de /grafana/ sem reescrever assets.
server {
    # nginx 1.24 (Ubuntu 24.04): http2 vai no listen, nao como diretiva propria
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.jvcamacho.dev;

    # Cloudflare Origin CA (*.jvcamacho.dev), modo Full (strict) na borda.
    ssl_certificate     /etc/ssl/cloudflare/jvcamacho.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jvcamacho.dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/bluesky-grafana.access.log;
    error_log  /var/log/nginx/bluesky-grafana.error.log;

    auth_basic           "bluesky-trends";
    auth_basic_user_file /etc/nginx/.htpasswd-trends;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket do Grafana Live
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.jvcamacho.dev;
    return 301 https://$host$request_uri;
}
