# Grafana do bluesky-trends em subdominio proprio, atras do nginx do host.
#
# Instalacao (como root, na VPS):
#   install -m 644 deploy/nginx-grafana.conf /etc/nginx/sites-available/bluesky-grafana
#   ln -sf /etc/nginx/sites-available/bluesky-grafana /etc/nginx/sites-enabled/bluesky-grafana
#   htpasswd -c /etc/nginx/.htpasswd-trends <usuario>   # o mesmo do dashboard
#   certbot --nginx -d grafana.jvcamacho.dev
#   nginx -t && systemctl reload nginx
#
# O Grafana escuta so em 127.0.0.1:3000 (ver docker-compose.yml). O proxy fica
# aqui para o container nunca ser publicado direto. Subdominio, nunca subcaminho:
# Grafana nao funciona bem atras de /grafana/ sem reescrever assets.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.jvcamacho.dev;

    ssl_certificate     /etc/letsencrypt/live/grafana.jvcamacho.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.jvcamacho.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/bluesky-grafana.access.log;
    error_log  /var/log/nginx/bluesky-grafana.error.log;

    auth_basic           "bluesky-trends";
    auth_basic_user_file /etc/nginx/.htpasswd-trends;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket do Grafana Live
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.jvcamacho.dev;
    return 301 https://$host$request_uri;
}
