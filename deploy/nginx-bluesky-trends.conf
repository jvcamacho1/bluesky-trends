# Painel publico do bluesky-trends em blueskytrends.jvcamacho.dev.
#
# Rotas:
#   /            pagina publica (public/index.html), sem senha
#   /public.json agregados, sem senha, cache de 30 s
#   /flink/      pagina das janelas do Flink (public/flink/index.html), sem senha
#   /flink.json  saida dos jobs Flink, sem senha, cache de 30 s
#   /interno/    painel de validacao e o data.json com posts brutos, com senha
#
# Instalacao (como root, na VPS):
#   install -m 644 deploy/nginx-bluesky-trends.conf /etc/nginx/sites-available/bluesky-trends
#   ln -sf /etc/nginx/sites-available/bluesky-trends /etc/nginx/sites-enabled/bluesky-trends
#   htpasswd -c /etc/nginx/.htpasswd-trends <usuario>
#   nginx -t && systemctl reload nginx
#
# O certificado vem da Cloudflare Origin CA (Full strict), em /etc/ssl/cloudflare/.
# O subdominio fica atras do proxy da Cloudflare, entao a origem so aceita 80 e 443.
# .dev so abre por HTTPS: o bloco da porta 80 existe apenas para redirecionar.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blueskytrends.jvcamacho.dev;

    # Cloudflare Origin CA (*.jvcamacho.dev), modo Full (strict) na borda.
    # Nao e Let's Encrypt: o navegador so ve o certificado da Cloudflare.
    ssl_certificate     /etc/ssl/cloudflare/jvcamacho.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jvcamacho.dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/bluesky-trends.access.log;
    error_log  /var/log/nginx/bluesky-trends.error.log;

    root /srv/bluesky/public;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # pagina publica: aberta, cache curto
    location = / {
        root /srv/bluesky/public;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /index.html =404;
    }

    # agregados: abertos, 30 s de cache (a Cloudflare respeita este cabecalho)
    location = /public.json {
        root /srv/bluesky/public;
        default_type application/json;
        add_header Cache-Control "public, max-age=30" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # janelas do Flink (fase 2): pagina e dados abertos, mesmo cache do painel
    location = /flink {
        return 301 https://$host/flink/;
    }

    location = /flink/ {
        root /srv/bluesky/public;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        try_files /flink/index.html =404;
    }

    location = /flink.json {
        root /srv/bluesky/public;
        default_type application/json;
        add_header Cache-Control "public, max-age=30" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # painel de validacao: posts brutos, so com senha
    location /interno/ {
        alias /srv/bluesky/private/;
        index index.html;
        auth_basic           "bluesky-trends interno";
        auth_basic_user_file /etc/nginx/.htpasswd-trends;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /interno/data.json {
        alias /srv/bluesky/private/data.json;
        default_type application/json;
        auth_basic           "bluesky-trends interno";
        auth_basic_user_file /etc/nginx/.htpasswd-trends;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # nada de listar diretorio nem servir o resto do disco
    location / {
        return 404;
    }

    # endereco antigo, quando o painel vivia em /trends/
    location /trends/ {
        return 301 https://$host/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name blueskytrends.jvcamacho.dev;
    return 301 https://$host$request_uri;
}
