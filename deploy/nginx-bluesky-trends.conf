# Dashboard estatico do bluesky-trends servido pelo nginx da VPS.
#
# Instalacao (como root):
#   install -m 644 deploy/nginx-bluesky-trends.conf /etc/nginx/sites-available/bluesky-trends
#   ln -sf /etc/nginx/sites-available/bluesky-trends /etc/nginx/sites-enabled/bluesky-trends
#   htpasswd -c /etc/nginx/.htpasswd-trends <usuario>   # ou reaproveite o do Grafana
#   nginx -t && systemctl reload nginx
#
# Ajuste server_name e os caminhos de certificado para o seu dominio.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trends.exemplo.com;

    ssl_certificate     /etc/letsencrypt/live/trends.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trends.exemplo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/bluesky-trends.access.log;
    error_log  /var/log/nginx/bluesky-trends.error.log;

    location /trends/ {
        alias /srv/bluesky/public/;
        index index.html;

        auth_basic           "bluesky-trends";
        auth_basic_user_file /etc/nginx/.htpasswd-trends;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        # o data.json muda a cada 5 min: nunca servir do cache
        location = /trends/data.json {
            alias /srv/bluesky/public/data.json;
            auth_basic           "bluesky-trends";
            auth_basic_user_file /etc/nginx/.htpasswd-trends;
            add_header Cache-Control "no-store, must-revalidate" always;
            default_type application/json;
        }
    }

    location = /trends {
        return 301 /trends/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name trends.exemplo.com;
    return 301 https://$host$request_uri;
}
