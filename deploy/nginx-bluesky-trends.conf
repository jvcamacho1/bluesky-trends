# Dashboard estatico do bluesky-trends em blueskytrends.jvcamacho.dev.
#
# Instalacao (como root, na VPS):
#   install -m 644 deploy/nginx-bluesky-trends.conf /etc/nginx/sites-available/bluesky-trends
#   ln -sf /etc/nginx/sites-available/bluesky-trends /etc/nginx/sites-enabled/bluesky-trends
#   htpasswd -c /etc/nginx/.htpasswd-trends <usuario>
#   nginx -t && systemctl reload nginx
#
# O certificado vem da Cloudflare Origin CA (Full strict), em /etc/ssl/cloudflare/.
# Nada de certbot aqui: a borda da Cloudflare entrega o certificado publico.
#
# O subdominio fica atras do proxy da Cloudflare (criptografia Full strict), entao
# a origem so aceita 80 e 443. .dev so abre por HTTPS: o bloco da porta 80 existe
# apenas para redirecionar quem chegar direto na origem.
server {
    # nginx 1.24 (Ubuntu 24.04): http2 vai no listen, nao como diretiva propria
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blueskytrends.jvcamacho.dev;

    # Cloudflare Origin CA (*.jvcamacho.dev), modo Full (strict) na borda.
    # Nao e Let's Encrypt: o navegador so ve o certificado da Cloudflare.
    ssl_certificate     /etc/ssl/cloudflare/jvcamacho.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/jvcamacho.dev.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/bluesky-trends.access.log;
    error_log  /var/log/nginx/bluesky-trends.error.log;

    root /srv/bluesky/public;
    index index.html;

    auth_basic           "bluesky-trends";
    auth_basic_user_file /etc/nginx/.htpasswd-trends;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # o data.json muda a cada 5 min: nunca servir do cache
    location = /data.json {
        auth_basic           "bluesky-trends";
        auth_basic_user_file /etc/nginx/.htpasswd-trends;
        add_header Cache-Control "no-store, must-revalidate" always;
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # endereco antigo, quando o dashboard vivia em /trends/
    location /trends/ {
        return 301 https://$host/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name blueskytrends.jvcamacho.dev;
    return 301 https://$host$request_uri;
}
