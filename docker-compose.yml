name: bluesky-trends

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: bluesky-trends-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: bluesky-trends-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bluesky.posts.pt.v1 --partitions 3 --replication-factor 1
        --config retention.ms=86400000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bluesky.posts.pt.dlq.v1 --partitions 1 --replication-factor 1
        --config retention.ms=604800000
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.3"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: bluesky-trends-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx256M"
      SCHEMA_REGISTRY_DEBUG: "false"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.3"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: bluesky-trends-producer
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      INPUT_MODE: ws
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CURSOR_PATH: /data/cursor.json
    volumes:
      - ./data:/data
      - ./producer/tests/fixtures:/fixtures:ro
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

  # Exporta o data.json do dashboard a cada 5 minutos, direto do topico.
  # Substitui o antigo systemd timer: roda na mesma imagem do producer, sem
  # precisar de Python nem root no host. ./public e o que o nginx serve.
  dashboard-export:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: bluesky-trends-dashboard-export
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    command: ["python", "-m", "producer.dashboard_export"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: bluesky.posts.pt.v1
      DASHBOARD_OUTPUT: /public/data.json
      EXPORT_INTERVAL_S: "300"
    volumes:
      - ./public:/public
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.2"
