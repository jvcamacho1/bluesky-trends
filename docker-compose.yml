name: bluesky-trends

# A fase 2 (Flink) vive em docker-compose.flink.yml e entra aqui.
include:
  - docker-compose.flink.yml
  - docker-compose.clickhouse.yml

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: bluesky-trends-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx384M -Xms384M"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.4"
    healthcheck:
      # na VPS o kafka-topics leva mais de 10 s para responder enquanto o broker
      # recupera o log; timeout curto marcava unhealthy com o broker saudavel
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 120s

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: bluesky-trends-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bluesky.posts.pt.v1 --partitions 3 --replication-factor 1
        --config retention.ms=86400000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bluesky.posts.pt.dlq.v1 --partitions 1 --replication-factor 1
        --config retention.ms=604800000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bluesky.trending.v1 --partitions 3 --replication-factor 1
        --config cleanup.policy=compact --config retention.ms=86400000 &&
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists
        --topic bluesky.volume.v1 --partitions 1 --replication-factor 1
        --config cleanup.policy=compact --config retention.ms=86400000
    # roda uma vez no boot; 0,2 CPU so deixa a criacao dos topicos mais lenta
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.2"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: bluesky-trends-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xmx192M"
      SCHEMA_REGISTRY_DEBUG: "false"
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.2"
    healthcheck:
      # mesma razao do kafka: na VPS o primeiro heartbeat demora, e timeout
      # curto marcava unhealthy com o servico saudavel
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8081'"]
      interval: 15s
      timeout: 20s
      retries: 20
      start_period: 90s

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: bluesky-trends-producer
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      INPUT_MODE: ws
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CURSOR_PATH: /data/cursor.json
    volumes:
      - ./data:/data
      - ./producer/tests/fixtures:/fixtures:ro
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.35"

  # Agregados publicos do painel: consumidor de longa duracao, baldes de 5 min,
  # 24 h em memoria, public.json regravado a cada minuto. Sem porta publicada.
  public-export:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: bluesky-trends-public-export
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    command: ["python", "-m", "producer.public_export"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: bluesky.posts.pt.v1
      PUBLIC_OUTPUT: /public/public.json
      PUBLIC_INTERVAL_S: "60"
      PUBLIC_MIN_AUTHORS: "10"
    volumes:
      - ./public:/public
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # Pagina /flink/: le as janelas que o Flink grava (trending e volume) e
  # regrava o flink.json a cada 30 s. So JSON pequeno, sem Avro nem texto de
  # post. Sem porta publicada.
  flink-export:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: bluesky-trends-flink-export
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "producer.flink_export"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLINK_OUTPUT: /public/flink.json
      FLINK_INTERVAL_S: "30"
      FLINK_MIN_AUTHORS: "${FLINK_MIN_AUTHORS:-10}"
    volumes:
      - ./public:/public
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.1"

  # Grava as janelas do Kafka no ClickHouse. O Flink calcula a janela; este
  # servico so transporta, porque o conector JDBC do Flink nao fala ClickHouse.
  ch-sink:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: bluesky-trends-ch-sink
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "producer.ch_sink"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      CH_MIN_AUTHORS: "1"
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.05"

  # Le as janelas do ClickHouse e regrava historico.json a cada minuto.
  # So SELECT: quem escreve no banco e o Flink.
  ch-export:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: bluesky-trends-ch-export
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["python", "-m", "producer.ch_export"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      HISTORY_OUTPUT: /public/historico.json
      HISTORY_INTERVAL_S: "60"
    volumes:
      - ./public:/public
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.05"

  # Exporta o data.json do painel interno a cada 5 minutos, direto do topico.
  # Substitui o antigo systemd timer: roda na mesma imagem do producer, sem
  # precisar de Python nem root no host. ./public e o que o nginx serve.
  dashboard-export:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: bluesky-trends-dashboard-export
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    command: ["python", "-m", "producer.dashboard_export"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: bluesky.posts.pt.v1
      DASHBOARD_OUTPUT: /private/data.json
      EXPORT_INTERVAL_S: "300"
    volumes:
      - ./private:/private
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.2"
