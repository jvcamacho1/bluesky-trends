<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bluesky-trends — ingestão</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3;
         margin: 0; padding: 2rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .sub { color: #8b949e; font-size: .85rem; margin-bottom: 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
          gap: 1rem; margin-bottom: 1.5rem; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
  .card h2 { font-size: .8rem; text-transform: uppercase; color: #8b949e; margin: 0 0 .5rem; }
  .big { font-size: 2rem; font-weight: 700; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
  .bar { background: #238636; border-radius: 3px 3px 0 0; min-width: 8px; flex: 1;
         position: relative; }
  .bar span { position: absolute; bottom: -1.4rem; left: 50%; transform: translateX(-50%);
              font-size: .6rem; color: #8b949e; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: .5rem; }
  .tag { background: #1f6feb33; border: 1px solid #1f6feb; padding: .15rem .5rem;
         border-radius: 999px; font-size: .8rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.post { border-bottom: 1px solid #21262d; padding: .6rem 0; }
  li.post .meta { color: #8b949e; font-size: .75rem; }
  section { margin-bottom: 2rem; }
  .error { color: #f85149; }
</style>
</head>
<body>
<h1>bluesky-trends — validação da ingestão</h1>
<div class="sub">Snapshot estático gerado a partir do tópico Kafka <code>bluesky.posts.pt.v1</code> · atualizado <span id="ts">—</span></div>

<div class="grid">
  <div class="card"><h2>Posts ingeridos</h2><div class="big" id="total">—</div></div>
  <div class="card"><h2>Hashtag mais frequente</h2><div class="big" id="top-tag">—</div></div>
  <div class="card"><h2>Pico de posts/min</h2><div class="big" id="peak">—</div></div>
</div>

<section>
  <div class="card">
    <h2>Volume por minuto</h2>
    <div class="bars" id="bars"></div>
  </div>
</section>

<section>
  <div class="card">
    <h2>Hashtags</h2>
    <div class="tags" id="tags"></div>
  </div>
</section>

<section>
  <div class="card">
    <h2>Últimos posts</h2>
    <ul id="posts"></ul>
  </div>
</section>

<script>
async function load() {
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    render(data);
  } catch (e) {
    document.querySelector('.sub').innerHTML +=
      '<span class="error"> — data.json não encontrado</span>';
  }
}

function render(data) {
  document.getElementById('ts').textContent =
    new Date(data.generated_at).toLocaleString('pt-BR');
  document.getElementById('total').textContent = data.total_posts;

  const top = data.top_hashtags[0];
  document.getElementById('top-tag').textContent = top ? `#${top.tag}` : '—';

  const volume = data.volume_per_minute;
  const peak = volume.reduce((m, v) => Math.max(m, v.count), 0);
  document.getElementById('peak').textContent = peak || '—';

  const max = Math.max(...volume.map(v => v.count), 1);
  const bars = document.getElementById('bars');
  bars.innerHTML = volume.slice(-40).map(v =>
    `<div class="bar" style="height:${(v.count / max) * 100}%"
       title="${v.minute}: ${v.count} posts"></div>`).join('');

  document.getElementById('tags').innerHTML = data.top_hashtags.map(h =>
    `<span class="tag">#${h.tag} · ${h.count}</span>`).join('');

  document.getElementById('posts').innerHTML = data.latest_posts.slice().reverse().map(p =>
    `<li class="post"><div>${escapeHtml(p.text)}</div>
     <div class="meta">${p.event_time} · ${p.did.slice(0, 18)}… · ${p.langs.join(', ')}</div></li>`
  ).join('');
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
